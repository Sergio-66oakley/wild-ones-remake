<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wild Ones Remake - Beta 0.8</title>

<style>
* {
  box-sizing: border-box;
  touch-action: none;
}

body {
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
}

#game {
  width: 100vw;
  height: 100vh;
  display: block;
}

#hud {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: space-between;
  color: white;
  font-weight: bold;
  font-size: 16px;
  text-shadow: 2px 2px 3px black;
  z-index: 10;
}

#turn,
#weapon {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-weight: bold;
  text-shadow: 2px 2px 4px black;
  z-index: 10;
}

#turn {
  top: 45px;
  font-size: 20px;
}

#weapon {
  top: 75px;
  font-size: 17px;
}

#power {
  position: fixed;
  bottom: 115px;
  left: 50%;
  transform: translateX(-50%);
  width: 220px;
  text-align: center;
  color: white;
  font-weight: bold;
  text-shadow: 2px 2px 3px black;
  z-index: 10;
}

#powerBar {
  width: 100%;
  height: 20px;
  background: #222;
  border: 2px solid white;
  border-radius: 10px;
  overflow: hidden;
}

#powerFill {
  width: 10%;
  height: 100%;
  background: #ffcc00;
}

#controls {
  position: fixed;
  bottom: 18px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 10px;
  z-index: 10;
}

button {
  width: 62px;
  height: 62px;
  border: 0;
  border-radius: 50%;
  font-size: 25px;
  background: rgba(255,255,255,0.9);
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

#jump {
  background: #58a6ff;
  color: white;
  font-size: 13px;
  font-weight: bold;
}

#weaponButton {
  background: #4b7bec;
  color: white;
  font-size: 12px;
  font-weight: bold;
}

#fire {
  background: #ffb300;
  width: 76px;
  height: 76px;
}

#message {
  position: fixed;
  top: 43%;
  left: 50%;
  transform: translate(-50%,-50%);
  color: white;
  font-size: 35px;
  font-weight: bold;
  text-shadow: 3px 3px 5px black;
  display: none;
  z-index: 20;
}

#damageText {
  position: fixed;
  top: 35%;
  left: 50%;
  transform: translateX(-50%);
  color: #ffdf00;
  font-size: 30px;
  font-weight: bold;
  text-shadow: 3px 3px 5px black;
  display: none;
  z-index: 25;
}

#restart {
  position: fixed;
  top: 55%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 160px;
  height: 55px;
  border-radius: 15px;
  font-size: 20px;
  font-weight: bold;
  display: none;
  z-index: 30;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div>🪙 999999</div>
  <div>🍪 999999</div>
  <div>❤️ <span id="health">100</span></div>
</div>

<div id="turn">TU TURNO</div>

<div id="weapon">
  🔫 <span id="weaponName">BÁSICA</span>
  · DAÑO <span id="weaponDamage">60</span>
</div>

<div id="power">
  POTENCIA
  <div id="powerBar">
    <div id="powerFill"></div>
  </div>
</div>

<div id="controls">
  <button id="left">◀</button>
  <button id="jump">SALTAR</button>
  <button id="weaponButton">CAMBIAR</button>
  <button id="fire">💥</button>
  <button id="right">▶</button>
</div>

<div id="message"></div>
<div id="damageText"></div>
<button id="restart">REINICIAR</button>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);


/* =========================
   MUNDO
========================= */

const worldWidth = 3000;
let cameraX = 0;


/* =========================
   JUGADOR
========================= */

const player = {
  x: 250,
  y: 0,
  radius: 25,
  health: 100,
  vx: 0,
  vy: 0,
  onGround: false
};


/* =========================
   ENEMIGO
========================= */

const enemy = {
  x: 2500,
  y: 0,
  radius: 25,
  health: 100
};


/* =========================
   ARMAS
========================= */

const weapons = [
  {
    name: "BÁSICA",
    damage: 60,
    radius: 75,
    color: "#555",
    speed: 1
  },
  {
    name: "BOMBA",
    damage: 75,
    radius: 105,
    color: "#222",
    speed: 0.85
  },
  {
    name: "MEGA",
    damage: 100,
    radius: 140,
    color: "#ff3b00",
    speed: 0.7
  }
];

let weaponIndex = 0;


/* =========================
   VARIABLES
========================= */

let projectile = null;
let enemyProjectile = null;
let explosion = null;

let charging = false;
let power = 0.1;
let aimAngle = -0.65;

let gameOver = false;
let turn = "player";

let enemyThinking = false;
let enemyTimer = 0;


/* =========================
   TERRENO
========================= */

function groundY(x) {

  return canvas.height * 0.72
    + Math.sin(x * 0.015) * 25
    + Math.sin(x * 0.006) * 35;
}


/* =========================
   CÁMARA
========================= */

function updateCamera() {

  cameraX = player.x - canvas.width * 0.35;

  if (cameraX < 0) {
    cameraX = 0;
  }

  const maxCamera = Math.max(
    0,
    worldWidth - canvas.width
  );

  if (cameraX > maxCamera) {
    cameraX = maxCamera;
  }
}


/* =========================
   TERRENO
========================= */

function drawGround() {

  ctx.beginPath();

  ctx.moveTo(0, canvas.height);

  for (
    let screenX = 0;
    screenX <= canvas.width;
    screenX += 5
  ) {

    const worldX = screenX + cameraX;

    ctx.lineTo(
      screenX,
      groundY(worldX)
    );
  }

  ctx.lineTo(canvas.width, canvas.height);
  ctx.closePath();

  ctx.fillStyle = "#579443";
  ctx.fill();

  ctx.strokeStyle = "#396d2c";
  ctx.lineWidth = 3;

  ctx.beginPath();

  for (
    let screenX = 0;
    screenX <= canvas.width;
    screenX += 5
  ) {

    const worldX = screenX + cameraX;
    const y = groundY(worldX);

    if (screenX === 0) {
      ctx.moveTo(screenX, y);
    } else {
      ctx.lineTo(screenX, y);
    }
  }

  ctx.stroke();
}


/* =========================
   ANIMAL
========================= */

function drawAnimal(
  worldX,
  y,
  bodyColor,
  health
) {

  const x = worldX - cameraX;

  ctx.fillStyle = bodyColor;

  ctx.beginPath();
  ctx.arc(x, y, 25, 0, Math.PI * 2);
  ctx.fill();

  /* orejas */

  ctx.beginPath();

  ctx.arc(
    x - 17,
    y - 18,
    9,
    0,
    Math.PI * 2
  );

  ctx.arc(
    x + 17,
    y - 18,
    9,
    0,
    Math.PI * 2
  );

  ctx.fill();

  /* ojos */

  ctx.fillStyle = "white";

  ctx.beginPath();

  ctx.arc(
    x - 8,
    y - 6,
    5,
    0,
    Math.PI * 2
  );

  ctx.arc(
    x + 8,
    y - 6,
    5,
    0,
    Math.PI * 2
  );

  ctx.fill();

  /* pupilas */

  ctx.fillStyle = "#111";

  ctx.beginPath();

  ctx.arc(
    x - 8,
    y - 6,
    2,
    0,
    Math.PI * 2
  );

  ctx.arc(
    x + 8,
    y - 6,
    2,
    0,
    Math.PI * 2
  );

  ctx.fill();

  /* vida */

  ctx.fillStyle = "#222";

  ctx.fillRect(
    x - 30,
    y - 42,
    60,
    6
  );

  ctx.fillStyle = "#e33";

  ctx.fillRect(
    x - 30,
    y - 42,
    60 * Math.max(0, health) / 100,
    6
  );
}


/* =========================
   APUNTADO
========================= */

function drawAim() {

  if (
    !charging ||
    projectile ||
    gameOver ||
    turn !== "player"
  ) return;

  const length = 120 + power * 100;

  const px = player.x - cameraX;

  const endX =
    px + Math.cos(aimAngle) * length;

  const endY =
    player.y + Math.sin(aimAngle) * length;

  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;
  ctx.setLineDash([8,8]);

  ctx.beginPath();

  ctx.moveTo(px, player.y);
  ctx.lineTo(endX, endY);

  ctx.stroke();

  ctx.setLineDash([]);

  ctx.fillStyle = "#ffcc00";

  ctx.beginPath();

  ctx.arc(
    endX,
    endY,
    7,
    0,
    Math.PI * 2
  );

  ctx.fill();
}


/* =========================
   TRAYECTORIA
========================= */

function drawTrajectory() {

  if (
    !charging ||
    projectile ||
    gameOver ||
    turn !== "player"
  ) return;

  const weapon = weapons[weaponIndex];

  const speed =
    (5 + power * 12) * weapon.speed;

  let px = player.x;
  let py = player.y;

  let vx = Math.cos(aimAngle) * speed;
  let vy = Math.sin(aimAngle) * speed;

  ctx.fillStyle = "rgba(255,255,255,0.7)";

  for (let i = 0; i < 30; i++) {

    px += vx;
    py += vy;

    vy += 0.35;

    ctx.beginPath();

    ctx.arc(
      px - cameraX,
      py,
      3,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }
}


/* =========================
   EXPLOSIÓN
========================= */

function drawExplosion() {

  if (!explosion) return;

  const progress =
    explosion.time / explosion.duration;

  const radius =
    explosion.maxRadius * progress;

  ctx.save();

  ctx.globalAlpha = 1 - progress;

  ctx.fillStyle = explosion.color;

  ctx.beginPath();

  ctx.arc(
    explosion.x - cameraX,
    explosion.y,
    radius,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.strokeStyle = "#ffcc00";
  ctx.lineWidth = 8;

  ctx.beginPath();

  ctx.arc(
    explosion.x - cameraX,
    explosion.y,
    radius,
    0,
    Math.PI * 2
  );

  ctx.stroke();

  ctx.restore();
}


/* =========================
   CREAR EXPLOSIÓN
========================= */

function createExplosion(
  x,
  y,
  attacker,
  weapon
) {

  explosion = {
    x: x,
    y: y,
    time: 0,
    duration: 30,
    maxRadius: weapon.radius,
    color: weapon.color
  };

  if (attacker === "player") {

    const distance = Math.hypot(
      x - enemy.x,
      y - enemy.y
    );

    if (distance < weapon.radius) {

      const multiplier =
        1 - distance / weapon.radius;

      const damage = Math.round(
        weapon.damage * multiplier
      );

      enemy.health -= damage;

      if (enemy.health < 0) {
        enemy.health = 0;
      }

      showDamage(damage);

      if (enemy.health <= 0) {

        gameOver = true;

        showMessage("¡VICTORIA!");

        document.getElementById(
          "restart"
        ).style.display = "block";
      }
    }
  }

  if (attacker === "enemy") {

    const distance = Math.hypot(
      x - player.x,
      y - player.y
    );

    if (distance < weapon.radius) {

      const multiplier =
        1 - distance / weapon.radius;

      const damage = Math.round(
        weapon.damage * multiplier
      );

      player.health -= damage;

      if (player.health < 0) {
        player.health = 0;
      }

      document.getElementById(
        "health"
      ).textContent = player.health;

      showDamage(damage);

      if (player.health <= 0) {

        gameOver = true;

        showMessage("¡DERROTA!");

        document.getElementById(
          "restart"
        ).style.display = "block";
      }
    }
  }
}


/* =========================
   DAÑO
========================= */

function showDamage(damage) {

  const text =
    document.getElementById(
      "damageText"
    );

  text.textContent = "-" + damage;
  text.style.display = "block";

  setTimeout(function() {
    text.style.display = "none";
  }, 700);
}


/* =========================
   EXPLOSIÓN UPDATE
========================= */

function updateExplosion() {

  if (!explosion) return;

  explosion.time++;

  if (
    explosion.time >=
    explosion.duration
  ) {
    explosion = null;
  }
}


/* =========================
   PROYECTIL JUGADOR
========================= */

function updatePlayerProjectile() {

  if (!projectile) return;

  projectile.vy += 0.35;

  projectile.x += projectile.vx;
  projectile.y += projectile.vy;

  const distanceToEnemy =
    Math.hypot(
      projectile.x - enemy.x,
      projectile.y - enemy.y
    );

  if (distanceToEnemy < 35) {

    createExplosion(
      projectile.x,
      projectile.y,
      "player",
      projectile.weapon
    );

    projectile = null;

    if (!gameOver) {
      startEnemyTurn();
    }

    return;
  }

  if (
    projectile &&
    projectile.y >=
    groundY(projectile.x) - 5
  ) {

    createExplosion(
      projectile.x,
      groundY(projectile.x),
      "player",
      projectile.weapon
    );

    projectile = null;

    if (!gameOver) {
      startEnemyTurn();
    }

    return;
  }

  if (
    projectile &&
    (
      projectile.x < -100 ||
      projectile.x > worldWidth + 100 ||
      projectile.y > canvas.height + 150
    )
  ) {

    projectile = null;

    if (!gameOver) {
      startEnemyTurn();
    }
  }
}


/* =========================
   TURNO ENEMIGO
========================= */

function startEnemyTurn() {

  if (gameOver) return;

  turn = "enemy";

  charging = false;

  document.getElementById(
    "turn"
  ).textContent =
    "TURNO DEL ENEMIGO";

  enemyThinking = true;
  enemyTimer = 90;
}


/* =========================
   ATAQUE ENEMIGO
========================= */

function enemyAttack() {

  if (gameOver) return;

  enemyThinking = false;

  const dx = player.x - enemy.x;
  const dy = player.y - enemy.y;

  const angle =
    Math.atan2(dy, dx);

  const speed = 8;

  const enemyWeapon = weapons[1];

  enemyProjectile = {

    x:
      enemy.x +
      Math.cos(angle) * 25,

    y:
      enemy.y +
      Math.sin(angle) * 25,

    vx:
      Math.cos(angle) * speed,

    vy:
      Math.sin(angle) * speed,

    weapon:
      enemyWeapon
  };
}


/* =========================
   PROYECTIL ENEMIGO
========================= */

function updateEnemyProjectile() {

  if (!enemyProjectile) return;

  enemyProjectile.vy += 0.35;

  enemyProjectile.x +=
    enemyProjectile.vx;

  enemyProjectile.y +=
    enemyProjectile.vy;

  const distanceToPlayer =
    Math.hypot(
      enemyProjectile.x - player.x,
      enemyProjectile.y - player.y
    );

  if (distanceToPlayer < 35) {

    createExplosion(
      enemyProjectile.x,
      enemyProjectile.y,
      "enemy",
      enemyProjectile.weapon
    );

    enemyProjectile = null;

    if (!gameOver) {
      startPlayerTurn();
    }

    return;
  }

  if (
    enemyProjectile &&
    enemyProjectile.y >=
    groundY(enemyProjectile.x) - 5
  ) {

    createExplosion(
      enemyProjectile.x,
      groundY(enemyProjectile.x),
      "enemy",
      enemyProjectile.weapon
    );

    enemyProjectile = null;

    if (!gameOver) {
      startPlayerTurn();
    }

    return;
  }

  if (
    enemyProjectile &&
    (
      enemyProjectile.x < -100 ||
      enemyProjectile.x > worldWidth + 100 ||
      enemyProjectile.y > canvas.height + 150
    )
  ) {

    enemyProjectile = null;

    if (!gameOver) {
      startPlayerTurn();
    }
  }
}


/* =========================
   TURNO JUGADOR
========================= */

function startPlayerTurn() {

  if (gameOver) return;

  turn = "player";

  document.getElementById(
    "turn"
  ).textContent = "TU TURNO";

  power = 0.1;

  document.getElementById(
    "powerFill"
  ).style.width = "10%";
}


/* =========================
   SALTO
========================= */

function jump() {

  if (
    gameOver ||
    turn !== "player"
  ) return;

  if (player.onGround) {

    player.vy = -11;

    player.onGround = false;
  }
}


/* =========================
   UPDATE
========================= */

function update() {

  if (gameOver) return;

  player.vy += 0.5;

  player.x += player.vx;
  player.y += player.vy;

  if (player.x < 30) {
    player.x = 30;
  }

  if (player.x > worldWidth - 30) {
    player.x = worldWidth - 30;
  }

  const ground =
    groundY(player.x);

  if (
    player.y +
    player.radius >=
    ground
  ) {

    player.y =
      ground -
      player.radius;

    player.vy = 0;

    player.onGround = true;

  } else {

    player.onGround = false;
  }

  enemy.y =
    groundY(enemy.x) -
    enemy.radius;

  if (
    charging &&
    !projectile &&
    turn === "player"
  ) {

    power += 0.012;

    if (power > 1) {
      power = 1;
    }

    document.getElementById(
      "powerFill"
    ).style.width =
      (power * 100) + "%";
  }

  updatePlayerProjectile();
  updateEnemyProjectile();
  updateExplosion();

  if (enemyThinking) {

    enemyTimer--;

    if (enemyTimer <= 0) {
      enemyAttack();
    }
  }

  player.vx *= 0.85;

  updateCamera();
}


/* =========================
   DIBUJO
========================= */

function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      canvas.height
    );

  gradient.addColorStop(
    0,
    "#65b8e8"
  );

  gradient.addColorStop(
    1,
    "#d8f2ff"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  /* sol */

  ctx.fillStyle = "#ffd95a";

  ctx.beginPath();

  ctx.arc(
    canvas.width - 70,
    70,
    35,
    0,
    Math.PI * 2
  );

  ctx.fill();

  /* nubes */

  drawCloud(
    200 - cameraX * 0.2,
    120
  );

  drawCloud(
    700 - cameraX * 0.2,
    160
  );

  drawCloud(
    1300 - cameraX * 0.2,
    110
  );

  drawGround();

  drawAnimal(
    player.x,
    player.y,
    "#f2a23a",
    player.health
  );

  drawAnimal(
    enemy.x,
    enemy.y,
    "#b85cdb",
    enemy.health
  );

  drawAim();
  drawTrajectory();

  /* proyectil jugador */

  if (projectile) {

    ctx.fillStyle =
      projectile.weapon.color;

    ctx.beginPath();

    ctx.arc(
      projectile.x - cameraX,
      projectile.y,
      8,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }

  /* proyectil enemigo */

  if (enemyProjectile) {

    ctx.fillStyle =
      enemyProjectile.weapon.color;

    ctx.beginPath();

    ctx.arc(
      enemyProjectile.x - cameraX,
      enemyProjectile.y,
      8,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }

  drawExplosion();

  drawFlag(
    100,
    groundY(100)
  );

  drawFlag(
    worldWidth - 100,
    groundY(worldWidth - 100)
  );
}


/* =========================
   NUBES
========================= */

function drawCloud(x, y) {

  ctx.fillStyle =
    "rgba(255,255,255,0.75)";

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    25,
    0,
    Math.PI * 2
  );

  ctx.arc(
    x + 30,
    y - 10,
    32,
    0,
    Math.PI * 2
  );

  ctx.arc(
    x + 65,
    y,
    25,
    0,
    Math.PI * 2
  );

  ctx.fill();
}


/* =========================
   BANDERA
========================= */

function drawFlag(x, ground) {

  const screenX =
    x - cameraX;

  ctx.strokeStyle = "#333";
  ctx.lineWidth = 5;

  ctx.beginPath();

  ctx.moveTo(
    screenX,
    ground
  );

  ctx.lineTo(
    screenX,
    ground - 90
  );

  ctx.stroke();

  ctx.fillStyle = "#e33";

  ctx.beginPath();

  ctx.moveTo(
    screenX,
    ground - 90
  );

  ctx.lineTo(
    screenX + 45,
    ground - 75
  );

  ctx.lineTo(
    screenX,
    ground - 60
  );

  ctx.closePath();

  ctx.fill();
}


/* =========================
   MOVIMIENTO
========================= */

function moveLeft() {

  if (
    gameOver ||
    turn !== "player"
  ) return;

  player.vx = -4;
}


function moveRight() {

  if (
    gameOver ||
    turn !== "player"
  ) return;

  player.vx = 4;
}


/* =========================
   APUNTAR
========================= */

function updateAim(
  clientX,
  clientY
) {

  const dx =
    clientX -
    (player.x - cameraX);

  const dy =
    clientY -
    player.y;

  aimAngle =
    Math.atan2(
      dy,
      dx
    );
}


/* =========================
   CARGAR
========================= */

function startCharge(event) {

  event.preventDefault();

  if (
    projectile ||
    gameOver ||
    turn !== "player"
  ) return;

  charging = true;
  power = 0.1;

  if (
    event.touches &&
    event.touches.length > 0
  ) {

    updateAim(
      event.touches[0].clientX,
      event.touches[0].clientY
    );
  }
}


/* =========================
   APUNTAR

function aimWhileTouching(event) {

  if (!charging) return;

  event.preventDefault();

  if (
    event.touches &&
    event.touches.length > 0
  ) {

    updateAim(
      event.touches[0].clientX,
      event.touches[0].clientY
    );
  }
}
