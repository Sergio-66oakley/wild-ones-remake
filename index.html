<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Wild Ones Remake - Beta 0.5</title>

<style>
* {
  box-sizing: border-box;
  touch-action: none;
}

body {
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
}

#game {
  width: 100vw;
  height: 100vh;
  display: block;
}

#hud {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: space-between;
  color: white;
  font-weight: bold;
  font-size: 16px;
  text-shadow: 2px 2px 3px black;
  z-index: 10;
}

#power {
  position: fixed;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%);
  width: 220px;
  text-align: center;
  color: white;
  font-weight: bold;
  text-shadow: 2px 2px 3px black;
  z-index: 10;
}

#powerBar {
  width: 100%;
  height: 20px;
  background: #222;
  border: 2px solid white;
  border-radius: 10px;
  overflow: hidden;
}

#powerFill {
  width: 10%;
  height: 100%;
  background: #ffcc00;
}

#controls {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 10;
}

button {
  width: 75px;
  height: 75px;
  border: 0;
  border-radius: 50%;
  font-size: 30px;
  background: rgba(255,255,255,0.9);
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

#fire {
  background: #ffb300;
}

#restart {
  position: fixed;
  top: 52%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 150px;
  height: 55px;
  border-radius: 15px;
  font-size: 20px;
  font-weight: bold;
  display: none;
  z-index: 30;
}

#message {
  position: fixed;
  top: 42%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 35px;
  font-weight: bold;
  text-shadow: 3px 3px 5px black;
  display: none;
  z-index: 20;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div>🪙 999999</div>
  <div>🍪 999999</div>
  <div>❤️ <span id="health">100</span></div>
</div>

<div id="power">
  POTENCIA
  <div id="powerBar">
    <div id="powerFill"></div>
  </div>
</div>

<div id="controls">
  <button id="left">◀</button>
  <button id="fire">💥</button>
  <button id="right">▶</button>
</div>

<div id="message"></div>

<button id="restart">REINICIAR</button>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

const player = {
  x: 120,
  y: 0,
  radius: 25,
  health: 100,
  vx: 0,
  vy: 0
};

const enemy = {
  x: 0,
  y: 0,
  radius: 25,
  health: 100
};

let projectile = null;
let explosion = null;

let direction = 1;

let charging = false;
let power = 0.1;

let aimAngle = -0.65;

let gameOver = false;

function groundY(x) {

  return canvas.height * 0.72 +
    Math.sin(x * 0.015) * 25 +
    Math.sin(x * 0.006) * 35;
}

function drawGround() {

  ctx.beginPath();

  ctx.moveTo(0, canvas.height);

  for (let x = 0; x <= canvas.width; x += 5) {
    ctx.lineTo(x, groundY(x));
  }

  ctx.lineTo(canvas.width, canvas.height);

  ctx.closePath();

  ctx.fillStyle = "#579443";
  ctx.fill();
}

function drawAnimal(x, y, bodyColor, health) {

  ctx.fillStyle = bodyColor;

  ctx.beginPath();
  ctx.arc(x, y, 25, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "white";

  ctx.beginPath();

  ctx.arc(x - 8, y - 6, 5, 0, Math.PI * 2);
  ctx.arc(x + 8, y - 6, 5, 0, Math.PI * 2);

  ctx.fill();

  ctx.fillStyle = "#111";

  ctx.beginPath();

  ctx.arc(x - 8, y - 6, 2, 0, Math.PI * 2);
  ctx.arc(x + 8, y - 6, 2, 0, Math.PI * 2);

  ctx.fill();

  ctx.fillStyle = "#222";
  ctx.fillRect(x - 30, y - 42, 60, 6);

  ctx.fillStyle = "#e33";

  ctx.fillRect(
    x - 30,
    y - 42,
    60 * Math.max(0, health) / 100,
    6
  );
}

function drawAim() {

  if (!charging || projectile || gameOver) return;

  const length = 120 + power * 100;

  const endX =
    player.x + Math.cos(aimAngle) * length;

  const endY =
    player.y + Math.sin(aimAngle) * length;

  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 8]);

  ctx.beginPath();

  ctx.moveTo(player.x, player.y);
  ctx.lineTo(endX, endY);

  ctx.stroke();

  ctx.setLineDash([]);

  ctx.fillStyle = "#ffcc00";

  ctx.beginPath();

  ctx.arc(endX, endY, 7, 0, Math.PI * 2);

  ctx.fill();
}

function drawTrajectory() {

  if (!charging || projectile || gameOver) return;

  const speed = 5 + power * 12;

  let px = player.x;
  let py = player.y;

  let vx = Math.cos(aimAngle) * speed;
  let vy = Math.sin(aimAngle) * speed;

  ctx.fillStyle = "rgba(255,255,255,0.7)";

  for (let i = 0; i < 25; i++) {

    px += vx;
    py += vy;

    vy += 0.35;

    ctx.beginPath();

    ctx.arc(px, py, 3, 0, Math.PI * 2);

    ctx.fill();
  }
}

function drawExplosion() {

  if (!explosion) return;

  const progress =
    explosion.time / explosion.duration;

  const radius =
    explosion.maxRadius * progress;

  ctx.save();

  ctx.globalAlpha = 1 - progress;

  ctx.fillStyle = "#ffcc00";

  ctx.beginPath();

  ctx.arc(
    explosion.x,
    explosion.y,
    radius,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.strokeStyle = "#ff6600";
  ctx.lineWidth = 8;

  ctx.beginPath();

  ctx.arc(
    explosion.x,
    explosion.y,
    radius,
    0,
    Math.PI * 2
  );

  ctx.stroke();

  ctx.restore();
}

function createExplosion(x, y) {

  explosion = {
    x: x,
    y: y,
    time: 0,
    duration: 30,
    maxRadius: 75
  };

  const distance = Math.hypot(
    x - enemy.x,
    y - enemy.y
  );

  if (distance < 100) {

    const damage =
      Math.round(
        60 * (1 - distance / 100)
      );

    enemy.health -= damage;

    if (enemy.health < 0) {
      enemy.health = 0;
    }

    if (enemy.health <= 0) {

      gameOver = true;

      showMessage("¡VICTORIA!");
      document.getElementById("restart").style.display = "block";
    }
  }
}

function updateExplosion() {

  if (!explosion) return;

  explosion.time++;

  if (explosion.time >= explosion.duration) {
    explosion = null;
  }
}

function update() {

  if (gameOver) return;

  player.vy += 0.5;

  player.x += player.vx;
  player.y += player.vy;

  if (player.x < 30) {
    player.x = 30;
  }

  if (player.x > canvas.width - 30) {
    player.x = canvas.width - 30;
  }

  const ground = groundY(player.x);

  if (player.y + player.radius >= ground) {

    player.y = ground - player.radius;
    player.vy = 0;
  }

  enemy.x = canvas.width - 120;

  enemy.y =
    groundY(enemy.x) - enemy.radius;

  if (charging && !projectile) {

    power += 0.012;

    if (power > 1) {
      power = 1;
    }

    document.getElementById(
      "powerFill"
    ).style.width =
      (power * 100) + "%";
  }

  if (projectile) {

    projectile.vy += 0.35;

    projectile.x += projectile.vx;
    projectile.y += projectile.vy;

    const distanceToEnemy = Math.hypot(
      projectile.x - enemy.x,
      projectile.y - enemy.y
    );

    if (distanceToEnemy < 35) {

      createExplosion(
        projectile.x,
        projectile.y
      );

      projectile = null;
    }

    if (
      projectile &&
      projectile.y >= groundY(projectile.x) - 5
    ) {

      createExplosion(
        projectile.x,
        groundY(projectile.x)
      );

      projectile = null;
    }

    if (
      projectile &&
      (
        projectile.x < -50 ||
        projectile.x > canvas.width + 50 ||
        projectile.y > canvas.height + 100
      )
    ) {

      projectile = null;
    }
  }

  updateExplosion();

  player.vx *= 0.85;
}

function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      canvas.height
    );

  gradient.addColorStop(0, "#65b8e8");
  gradient.addColorStop(1, "#d8f2ff");

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle = "#ffd95a";

  ctx.beginPath();

  ctx.arc(
    canvas.width - 70,
    70,
    35,
    0,
    Math.PI * 2
  );

  ctx.fill();

  drawGround();

  drawAnimal(
    player.x,
    player.y,
    "#f2a23a",
    player.health
  );

  drawAnimal(
    enemy.x,
    enemy.y,
    "#b85cdb",
    enemy.health
  );

  drawAim();

  drawTrajectory();

  if (projectile) {

    ctx.fillStyle = "#333";

    ctx.beginPath();

    ctx.arc(
      projectile.x,
      projectile.y,
      8,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }

  drawExplosion();
}

function moveLeft() {

  if (gameOver) return;

  player.vx = -3;
  direction = -1;
}

function moveRight() {

  if (gameOver) return;

  player.vx = 3;
  direction = 1;
}

function updateAim(clientX, clientY) {

  const dx =
    clientX - player.x;

  const dy =
    clientY - player.y;

  aimAngle =
    Math.atan2(dy, dx);

  if (direction === -1 && aimAngle > 0) {
    aimAngle =
      -Math.PI + Math.abs(aimAngle);
  }
}

function startCharge(event) {

  event.preventDefault();

  if (projectile || gameOver) return;

  charging = true;
  power = 0.1;

  if (event.touches && event.touches.length > 0) {

    updateAim(
      event.touches[0].clientX,
      event.touches[0].clientY
    );
  }
}

function aimWhileTouching(event) {

  if (!charging) return;

  event.preventDefault();

  if (event.touches && event.touches.length > 0) {

    updateAim(
      event.touches[0].clientX,
      event.touches[0].clientY
    );
  }
}

function releaseFire(event) {

  event.preventDefault();

  if (!charging || projectile || gameOver) return;

  charging = false;

  const speed =
    5 + power * 12;

  projectile = {

    x:
      player.x +
      Math.cos(aimAngle) * 25,

    y:
      player.y +
      Math.sin(aimAngle) * 25,

    vx:
      Math.cos(aimAngle) * speed,

    vy:
      Math.sin(aimAngle) * speed
  };

  document.getElementById(
    "powerFill"
  ).style.width = "10%";
}

function showMessage(text) {

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.style.display = "block";
}

function restartGame() {

  enemy.health = 100;

  player.health = 100;

  player.x = 120;

  player.vx = 0;

  player.vy = 0;

  projectile = null;

  explosion = null;

  charging = false;

  power = 0.1;

  gameOver = false;

  document.getElementById(
    "powerFill"
  ).style.width = "10%";

  document.getElementById(
    "message"
  ).style.display = "none";

  document.getElementById(
    "restart"
  ).style.display = "none";
}

document
  .getElementById("left")
  .addEventListener(
    "touchstart",
    moveLeft
  );

document
  .getElementById("right")
  .addEventListener(
    "touchstart",
    moveRight
  );

document
  .getElementById("left")
  .addEventListener(
    "mousedown",
    moveLeft
  );

document
  .getElementById("right")
  .addEventListener(
    "mousedown",
    moveRight
  );

const fireButton =
  document.getElementById("fire");

fireButton.addEventListener(
  "touchstart",
  startCharge
);

fireButton.addEventListener(
  "touchmove",
  aimWhileTouching
);

fireButton.addEventListener(
  "touchend",
  releaseFire
);

fireButton.addEventListener(
  "mousedown",
  startCharge
);

fireButton.addEventListener(
  "mousemove",
  function(event) {

    if (charging) {

      updateAim(
        event.clientX,
        event.clientY
      );
    }
  }
);

fireButton.addEventListener(
  "mouseup",
  releaseFire
);

document
  .getElementById("restart")
  .addEventListener(
    "click",
    restartGame
  );

function gameLoop() {

  update();

  draw();

  requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
  </html>
